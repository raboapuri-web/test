    <line x1="912" y1="114" x2="947" y2="114"/>
    <line x1="912" y1="129" x2="947" y2="129"/>
    <line x1="912" y1="144" x2="947" y2="144"/>
  </g>
  <g fill="#f4dd48">
    <circle cx="1000" cy="112" r="12"/>
    <circle cx="1050" cy="112" r="12"/>
  </g>
  <g stroke="#e7ebef" stroke-width="5" stroke-linecap="round">
    <line x1="981" y1="112" x2="990" y2="112"/>
    <line x1="1012" y1="112" x2="1022" y2="112"/>
    <line x1="1062" y1="112" x2="1072" y2="112"/>
    <line x1="1089" y1="112" x2="1104" y2="112"/>
  </g>
  <rect x="987" y="136" width="110" height="15" fill="url(#ad2)"/>
</g>

<!-- wall band -->
<rect x="0" y="290" width="1600" height="24" fill="url(#wallBand)"/>


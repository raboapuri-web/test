<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7f97b1"/>
    <stop offset="100%" stop-color="#8fd0dd"/>
  </linearGradient>
  <linearGradient id="wallBand" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#d8dde2"/>
    <stop offset="100%" stop-color="#f2f2f2"/>
  </linearGradient>
  <linearGradient id="platformTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e1e2e6"/>
    <stop offset="100%" stop-color="#bfc2c9"/>
  </linearGradient>
  <linearGradient id="platformFront" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#868391"/>
    <stop offset="100%" stop-color="#514a56"/>
  </linearGradient>
  <linearGradient id="screenDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#444153"/>
    <stop offset="100%" stop-color="#282636"/>
  </linearGradient>
  <linearGradient id="trainBody" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fbfbfb"/>
    <stop offset="100%" stop-color="#e6e6ea"/>
  </linearGradient>
  <linearGradient id="trainWindow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffe773"/>
    <stop offset="100%" stop-color="#f5c53b"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#b0d2dd" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#7ca7b8" stop-opacity="0.95"/>
  </linearGradient>
  <linearGradient id="ad1" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#f89b12"/>
    <stop offset="100%" stop-color="#ffb341"/>
  </linearGradient>
  <linearGradient id="ad2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22b8c6"/>
    <stop offset="100%" stop-color="#2ce3d3"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.18"/>
  </filter>
  <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
  <pattern id="ceilingLines" width="100" height="100" patternUnits="userSpaceOnUse">
    <rect width="100" height="100" fill="none"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="#718699" stroke-width="2" opacity="0.15"/>
  </pattern>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#ceilingLines)"/>

<!-- ceiling light glow -->
<g opacity="0.25">
  <ellipse cx="310" cy="78" rx="120" ry="38" fill="#fff8cc" filter="url(#softglow)"/>
  <ellipse cx="820" cy="78" rx="120" ry="38" fill="#fff8cc" filter="url(#softglow)"/>
  <ellipse cx="1320" cy="78" rx="120" ry="38" fill="#fff8cc" filter="url(#softglow)"/>
</g>

<!-- sign boards hanging -->

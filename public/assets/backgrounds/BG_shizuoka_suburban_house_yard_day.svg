<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#78b7f0"/>
    <stop offset="100%" stop-color="#cfe8ff"/>
  </linearGradient>

  <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8fcf58"/>
    <stop offset="100%" stop-color="#6fb240"/>
  </linearGradient>

  <linearGradient id="deckWood" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#8f6b4c"/>
    <stop offset="100%" stop-color="#5c412f"/>
  </linearGradient>

  <linearGradient id="darkFrame" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#25282c"/>
    <stop offset="100%" stop-color="#111418"/>
  </linearGradient>

  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#94d1f1"/>
    <stop offset="55%" stop-color="#5c9fc3"/>
    <stop offset="100%" stop-color="#244159"/>
  </linearGradient>

  <linearGradient id="roofTrim" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#f8f7f3"/>
    <stop offset="100%" stop-color="#ebebe7"/>
  </linearGradient>

  <linearGradient id="soffit" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8b684b"/>
    <stop offset="100%" stop-color="#5f4836"/>
  </linearGradient>

  <linearGradient id="concrete" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#d7d9da"/>
    <stop offset="100%" stop-color="#b8b8b6"/>
  </linearGradient>

  <pattern id="whiteBrick" width="96" height="40" patternUnits="userSpaceOnUse">
    <rect width="96" height="40" fill="#f7f6f2"/>
    <path d="M0 20 H96 M0 40 H96" stroke="#dedcd5" stroke-width="2"/>
    <path d="M24 0 V20 M72 0 V20 M0 20 V40 M48 20 V40 M96 20 V40" stroke="#dfddd7" stroke-width="2"/>
  </pattern>

  <pattern id="deckBoards" width="72" height="26" patternUnits="userSpaceOnUse">
    <rect width="72" height="26" fill="url(#deckWood)"/>
    <path d="M0 25 H72" stroke="#412d22" stroke-width="2" opacity=".35"/>
    <path d="M8 12 C22 8 36 17 51 11 C60 8 65 9 72 7" fill="none" stroke="#ab8764" stroke-width="1.5" opacity=".25"/>
  </pattern>

  <filter id="shadow" x="-25%" y="-25%" width="160%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".18"/>
  </filter>

  <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
</defs>

<!-- sky -->
<rect width="1600" height="900" fill="url(#sky)"/>
<g fill="#ffffff" opacity=".72">
  <ellipse cx="235" cy="130" rx="76" ry="33"/>
  <ellipse cx="290" cy="120" rx="44" ry="24"/>
  <ellipse cx="1235" cy="95" rx="62" ry="28"/>
  <ellipse cx="1282" cy="109" rx="38" ry="19"/>
</g>

<!-- neighboring houses -->
<g opacity=".85">
  <polygon points="0,360 160,360 200,510 0,530" fill="#e7e0d7"/>
  <polygon points="1445,280 1600,250 1600,565 1410,540" fill="#dfc7c1"/>
  <rect x="1460" y="330" width="110" height="130" fill="#f0d8ce"/>
  <polygon points="1420,285 1600,255 1600,290 1420,320" fill="#a9bcc5"/>
</g>

<!-- ground -->
<rect x="0" y="610" width="1600" height="290" fill="url(#grass)"/>
<g opacity=".28" stroke="#6ea842" stroke-width="3">
  <path d="M0 690 C130 680 260 702 420 694 C620 684 790 704 990 690 C1185 676 1395 704 1600 696"/>
  <path d="M0 742 C170 726 370 754 570 742 C760 730 960 760 1160 748 C1335 738 1470 754 1600 748"/>
</g>

<!-- house shadow -->
<ellipse cx="792" cy="628" rx="540" ry="32" fill="#000" opacity=".10" filter="url(#softShadow)"/>

<!-- main house -->
<g filter="url(#shadow)">
  <!-- upper roof slabs -->
  <polygon points="180,218 815,218 815,255 180,255" fill="url(#roofTrim)"/>
  <polygon points="875,178 1450,178 1450,225 875,225" fill="url(#roofTrim)"/>
  <polygon points="180,255 815,255 800,282 195,282" fill="url(#soffit)"/>
  <polygon points="875,225 1450,225 1428,262 895,262" fill="url(#soffit)"/>

  <!-- left upper balcony / second floor -->
  <rect x="245" y="278" width="515" height="134" fill="url(#whiteBrick)"/>
  <rect x="270" y="300" width="420" height="86" fill="#2a2d31"/>
  <rect x="286" y="314" width="120" height="68" fill="url(#glass)"/>
  <rect x="414" y="314" width="110" height="68" fill="url(#glass)"/>
  <rect x="532" y="314" width="142" height="68" fill="url(#glass)"/>

  <!-- balcony -->
  <rect x="200" y="365" width="525" height="85" fill="#44474e"/>
  <rect x="200" y="365" width="525" height="12" fill="#2f3339"/>
  <rect x="200" y="377" width="525" height="73" fill="#5c6168" opacity=".16"/>
  <g stroke="#3f444a" stroke-width="3">
    <line x1="225" y1="372" x2="225" y2="448"/>
    <line x1="275" y1="372" x2="275" y2="448"/>
    <line x1="325" y1="372" x2="325" y2="448"/>
    <line x1="375" y1="372" x2="375" y2="448"/>
    <line x1="425" y1="372" x2="425" y2="448"/>
    <line x1="475" y1="372" x2="475" y2="448"/>
    <line x1="525" y1="372" x2="525" y2="448"/>
    <line x1="575" y1="372" x2="575" y2="448"/>
    <line x1="625" y1="372" x2="625" y2="448"/>
    <line x1="675" y1="372" x2="675" y2="448"/>
  </g>

  <!-- lower left house body -->
  <rect x="170" y="450" width="645" height="165" fill="url(#whiteBrick)"/>
  <rect x="170" y="450" width="210" height="165" fill="#24272b"/>
  <rect x="192" y="462" width="96" height="142" fill="#171a1d"/>
  <rect x="205" y="480" width="10" height="102" fill="#0f1216"/>
  <rect x="430" y="450" width="182" height="165" fill="url(#whiteBrick)"/>
  <rect x="640" y="450" width="145" height="165" fill="url(#whiteBrick)"/>

  <!-- entrance -->
  <rect x="210" y="468" width="72" height="132" rx="3" fill="url(#darkFrame)"/>
  <rect x="218" y="482" width="9" height="94" fill="#0b0d10"/>
  <rect x="232" y="485" width="4" height="83" fill="#34393d" opacity=".7"/>

  <!-- mailbox -->
  <rect x="310" y="530" width="34" height="92" fill="#33363a"/>
  <rect x="318" y="540" width="18" height="8" fill="#b8bbb9"/>
  <rect x="322" y="594" width="10" height="10" rx="2" fill="#1c1f22"/>

  <!-- center opening / interior -->
  <rect x="585" y="438" width="175" height="178" fill="#1f2226"/>
  <rect x="603" y="462" width="138" height="136" fill="url(#glass)"/>
  <line x1="671" y1="462" x2="671" y2="598" stroke="#23272b" stroke-width="8"/>
  <rect x="608" y="470" width="128" height="53" fill="#e0c481" opacity=".35"/>
  <rect x="620" y="538" width="22" height="46" fill="#473f3a" opacity=".55"/>
  <rect x="648" y="538" width="22" height="46" fill="#473f3a" opacity=".55"/>
  <rect x="676" y="538" width="22" height="46" fill="#473f3a" opacity=".55"/>
  <rect x="704" y="538" width="22" height="46" fill="#473f3a" opacity=".55"/>

  <!-- right main two-story volume -->
  <rect x="815" y="240" width="560" height="375" fill="url(#whiteBrick)"/>
  <rect x="930" y="240" width="220" height="375" fill="#805d48" opacity=".45"/>
  <rect x="930" y="240" width="220" height="375" fill="url(#whiteBrick)" opacity=".24"/>

  <!-- right high window bay -->
  <rect x="1108" y="258" width="202" height="357" fill="#2a2e33"/>
  <rect x="1130" y="280" width="73" height="84" fill="url(#glass)"/>
  <rect x="1215" y="280" width="73" height="84" fill="url(#glass)"/>
  <rect x="1130" y="374" width="73" height="84" fill="url(#glass)"/>
  <rect x="1215" y="374" width="73" height="84" fill="url(#glass)"/>
  <rect x="1130" y="468" width="158" height="135" fill="#edf0ec"/>
  <rect x="1147" y="483" width="124" height="110" fill="#f7f7f4"/>
  <rect x="1230" y="517" width="34" height="42" fill="#1f2022"/>
  <rect x="1165" y="575" width="70" height="6" fill="#664a3c" opacity=".5"/>

  <!-- wall joints on right -->
  <g stroke="#dedcd5" stroke-width="2" opacity=".75">
    <line x1="815" y1="280" x2="1108" y2="280"/>
    <line x1="815" y1="320" x2="1108" y2="320"/>
    <line x1="815" y1="360" x2="1108" y2="360"/>
    <line x1="815" y1="400" x2="1108" y2="400"/>
    <line x1="815" y1="440" x2="1108" y2="440"/>
    <line x1="815" y1="480" x2="1108" y2="480"/>
    <line x1="815" y1="520" x2="1108" y2="520"/>
    <line x1="815" y1="560" x2="1108" y2="560"/>
  </g>
</g>

<!-- deck -->
<g filter="url(#shadow)">
  <rect x="405" y="606" width="905" height="38" fill="url(#deckBoards)"/>
  <polygon points="405,644 1310,644 1286,667 423,667" fill="#513a2b"/>
  <g fill="#423126">
    <rect x="438" y="644" width="18" height="23"/>
    <rect x="490" y="644" width="18" height="23"/>
    <rect x="542" y="644" width="18" height="23"/>
    <rect x="594" y="644" width="18" height="23"/>
    <rect x="646" y="644" width="18" height="23"/>
    <rect x="698" y="644" width="18" height="23"/>
    <rect x="750" y="644" width="18" height="23"/>
    <rect x="802" y="644" width="18" height="23"/>
    <rect x="854" y="644" width="18" height="23"/>
    <rect x="906" y="644" width="18" height="23"/>
    <rect x="958" y="644" width="18" height="23"/>
    <rect x="1010" y="644" width="18" height="23"/>
    <rect x="1062" y="644" width="18" height="23"/>
    <rect x="1114" y="644" width="18" height="23"/>
    <rect x="1166" y="644" width="18" height="23"/>
    <rect x="1218" y="644" width="18" height="23"/>
  </g>
</g>

<!-- steps -->
<g>
  <rect x="170" y="606" width="118" height="20" fill="url(#concrete)"/>
  <rect x="180" y="626" width="100" height="16" fill="#b2b2b0"/>
</g>

<!-- terrace objects -->
<g>
  <rect x="870" y="600" width="52" height="16" fill="#ccc" opacity=".8"/>
  <rect x="1090" y="614" width="56" height="10" fill="#b9bab7" opacity=".85"/>
  <rect x="1278" y="615" width="42" height="14" fill="#d7d5d1"/>
  <ellipse cx="1260" cy="622" rx="14" ry="9" fill="#a7663c"/>
  <path d="M1249 622 C1250 610 1267 610 1271 622 C1270 610 1280 610 1282 621" fill="#56814e"/>
</g>

<!-- light shadow under eaves -->
<g opacity=".12">
  <rect x="245" y="278" width="515" height="12" fill="#000"/>
  <rect x="815" y="240" width="560" height="14" fill="#000"/>
  <rect x="170" y="450" width="645" height="16" fill="#000"/>
</g>

<!-- vignette -->
<rect width="1600" height="900" fill="none" stroke="#000" stroke-opacity=".06" stroke-width="28"/>
</svg>
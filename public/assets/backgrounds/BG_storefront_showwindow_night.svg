      <stop offset="100%" stop-color="#111522"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6f4f40"/>
      <stop offset="100%" stop-color="#4f372c"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#06101a"/>
    <stop offset="55%" stop-color="#0b1323"/>
    <stop offset="100%" stop-color="#15161b"/>
  </linearGradient>

  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#453229"/>
    <stop offset="100%" stop-color="#241b18"/>
  </linearGradient>

  <linearGradient id="leftFacadeA" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6d4a2f"/>
    <stop offset="100%" stop-color="#8c5a35"/>
  </linearGradient>

  <linearGradient id="leftFacadeB" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#3c2a26"/>
    <stop offset="100%" stop-color="#6a3c2d"/>
  </linearGradient>

  <linearGradient id="rightFacadeA" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#604031"/>
    <stop offset="100%" stop-color="#8a5127"/>
  </linearGradient>

  <linearGradient id="rightFacadeB" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#363033"/>
    <stop offset="100%" stop-color="#1f1d1f"/>
  </linearGradient>

  <linearGradient id="paperLight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fffbe8"/>
    <stop offset="100%" stop-color="#f7e4b2"/>
  </linearGradient>

  <linearGradient id="lanternRed" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ff6a45"/>
    <stop offset="100%" stop-color="#ca2314"/>
  </linearGradient>

  <linearGradient id="lanternWhite" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fffef4"/>
    <stop offset="100%" stop-color="#efe1bf"/>
  </linearGradient>

  <linearGradient id="signYellow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffef87"/>
    <stop offset="100%" stop-color="#d59e19"/>
  </linearGradient>

  <linearGradient id="signBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#63e0ff"/>
    <stop offset="100%" stop-color="#3652cf"/>
  </linearGradient>

  <linearGradient id="signPink" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ffa0d0"/>
    <stop offset="100%" stop-color="#ea3b8f"/>
  </linearGradient>

  <linearGradient id="windowGlow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fff0c1"/>
    <stop offset="100%" stop-color="#ffb54c"/>
  </linearGradient>

  <filter id="glowSoft" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>

  <filter id="glowSmall" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>

  <filter id="shadow" x="-30%" y="-30%" width="180%" height="180%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
  </filter>

  <pattern id="roofTile" width="34" height="22" patternUnits="userSpaceOnUse">
    <rect width="34" height="22" fill="#262123"/>
    <path d="M0 10 H34" stroke="#423a3b" stroke-width="2"/>
    <path d="M0 22 H34" stroke="#131012" stroke-width="2"/>
  </pattern>

  <pattern id="asphalt" width="70" height="70" patternUnits="userSpaceOnUse">
    <rect width="70" height="70" fill="none"/>
    <circle cx="18" cy="14" r="1.5" fill="#6e5644" opacity=".25"/>
    <circle cx="38" cy="55" r="2" fill="#5a4133" opacity=".18"/>
    <circle cx="58" cy="26" r="1.5" fill="#7d5a45" opacity=".22"/>
  </pattern>
</defs>

<rect width="1600" height="900" fill="url(#nightSky)"/>

<!-- deep alley haze -->
<ellipse cx="800" cy="265" rx="150" ry="80" fill="#ffd174" opacity=".18" filter="url(#glowSoft)"/>
<ellipse cx="790" cy="315" rx="170" ry="100" fill="#ff7b2f" opacity=".10" filter="url(#glowSoft)"/>


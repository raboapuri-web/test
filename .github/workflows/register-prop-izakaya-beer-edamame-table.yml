name: Register Izakaya Beer Edamame Table Prop

on:
  push:
    paths:
      - '.github/workflows/register-prop-izakaya-beer-edamame-table.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register prop in asset registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('public/assets/asset-registry.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          asset_id = 'prop_izakaya_beer_edamame_table'
          if not any(a.get('id') == asset_id for a in data.get('assets', [])):
              data['assets'].append({
                  'id': asset_id,
                  'type': 'prop',
                  'family': 'izakaya_table_set',
                  'variant': 'beer_four_mugs_edamame_wide_table',
                  'path': 'assets/props/PROP_izakaya_beer_edamame_table.svg',
                  'location': ['izakaya','restaurant','interior','table'],
                  'timeOfDay': ['evening','night','late_night'],
                  'sceneTypes': ['drinking','after_work','friends','casual_meal','conversation','nightlife','group_scene'],
                  'mood': ['casual','warm','ordinary','social','lived_in'],
                  'narrativeUse': [
                      '居酒屋で4人前後が飲んでいる場面の前景小物として使う',
                      'ビール瓶・ビールジョッキ4つ・枝豆がある庶民的な飲み会を示す',
                      '会話シーンで人物の手前に重ねて居酒屋らしい情報量を増やす'
                  ],
                  'visualKeywords': ['beer bottle','four beer mugs','edamame','wide izakaya table','transparent prop','Japanese pub'],
                  'avoidWhen': ['luxury restaurant','hotel','office','street','single-person drink'],
                  'shot': {
                      'type': 'overlay_prop',
                      'framing': 'wide_table_foreground',
                      'recommendedMotion': ['static','subtleParallax','slowPushIn']
                  }
              })
              path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY
      - name: Commit registry update
        run: |
          if git diff --quiet -- public/assets/asset-registry.json; then
            echo 'Registry already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/asset-registry.json
          git commit -m 'Register izakaya beer edamame table prop'
          git push

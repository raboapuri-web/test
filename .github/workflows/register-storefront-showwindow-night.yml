name: Register Storefront Showwindow Night

on:
  push:
    paths:
      - '.github/workflows/register-storefront-showwindow-night.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register asset in master JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('public/assets/asset-registry.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assets = data.setdefault('assets', [])
          asset_id = 'bg_storefront_showwindow_night'
          if not any(a.get('id') == asset_id for a in assets):
              assets.append({
                  'id': asset_id,
                  'type': 'background',
                  'family': 'storefront_showwindow',
                  'variant': 'night_boutique_display',
                  'path': 'assets/backgrounds/BG_storefront_showwindow_night.svg',
                  'location': ['Tokyo','urban','shopping_street','storefront','boutique'],
                  'timeOfDay': ['evening','night'],
                  'sceneTypes': ['shopping','window_shopping','city_walk','storefront','fashion','night_street','establishing'],
                  'mood': ['clean','stylish','warm','urban','inviting','cinematic'],
                  'narrativeUse': [
                      '夜の綺麗なショーウィンドウやブティック外観を示す',
                      '商品・照明・陳列を使って都会の消費や憧れを記号的に表現する',
                      '買い物・街歩き・店先で立ち止まるシーンの背景として使う'
                  ],
                  'visualKeywords': ['show window','boutique','storefront','fashion display','warm lighting','night shopping','products'],
                  'avoidWhen': ['daytime','rural','restaurant interior','ordinary home'],
                  'shot': {
                      'type': 'exterior_storefront',
                      'framing': 'wide_front',
                      'recommendedMotion': ['slowPushIn','slowPan','subtleLightFlicker','parallax']
                  }
              })
              path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY
      - name: Commit registry update
        run: |
          if git diff --quiet -- public/assets/asset-registry.json; then
            echo 'Registry already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/asset-registry.json
          git commit -m 'Register storefront showwindow night asset'
          git push

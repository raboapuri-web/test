name: Render Remotion Sample

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'eslint.config.mjs'
      - 'tsconfig.json'
      - '.github/workflows/render.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'eslint.config.mjs'
      - 'tsconfig.json'
      - '.github/workflows/render.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: npm install

      - name: Lint and typecheck
        run: npm run lint

      - name: Bundle compositions
        run: npm run build

      - name: Render original MP4
        run: npm run render

      - name: Render pilot MP4
        run: npm run render:pilot

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: thinking-night-sample
          path: out/thinking-night-sample.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Upload pilot video artifact
        uses: actions/upload-artifact@v4
        with:
          name: thinking-night-pilot
          path: out/thinking-night-pilot.mp4
          if-no-files-found: error
          retention-days: 14

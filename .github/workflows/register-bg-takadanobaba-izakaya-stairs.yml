name: Register Takadanobaba Izakaya Stairs Asset

on:
  push:
    paths:
      - '.github/workflows/register-bg-takadanobaba-izakaya-stairs.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register asset in master JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('public/assets/asset-registry.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          asset_id = 'bg_takadanobaba_izakaya_stairs'
          if not any(a.get('id') == asset_id for a in data.get('assets', [])):
              data['assets'].append({
                  'id': asset_id,
                  'type': 'background',
                  'family': 'takadanobaba_izakaya_stairs',
                  'variant': 'dim_neon_basement_stairs',
                  'path': 'assets/backgrounds/BG_takadanobaba_izakaya_stairs.svg',
                  'location': ['Tokyo','Shinjuku','Takadanobaba','basement_stairs','izakaya_entrance'],
                  'timeOfDay': ['evening','night','late_night'],
                  'sceneTypes': ['arrival','descent','transition','nightlife','izakaya_entrance','before_drinking','urban_detail'],
                  'mood': ['dim','narrow','neon','gritty','ordinary','nocturnal','slightly_tense'],
                  'narrativeUse': [
                      '地上から地下の居酒屋へ降りていく導入シーンに使う',
                      '高田馬場らしい雑多で少し薄暗い夜の空気を示す',
                      '居酒屋店内に入る前の場面転換や人物の移動シーンに使う'
                  ],
                  'visualKeywords': ['Takadanobaba','narrow basement stairs','neon sign','fluorescent light','handrail','dim corridor','izakaya entrance'],
                  'avoidWhen': ['daytime','luxury hotel','bright restaurant','wide outdoor street'],
                  'shot': {
                      'type': 'interior_transition',
                      'framing': 'wide_downward_perspective',
                      'recommendedMotion': ['slowPushIn','descendingPan','subtleNeonFlicker','parallax']
                  }
              })
              path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          PY
      - name: Commit registry update
        run: |
          if git diff --quiet -- public/assets/asset-registry.json; then
            echo 'Registry already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/asset-registry.json
          git commit -m 'Register Takadanobaba izakaya stairs asset'
          git push
